name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --workspace

  compliance_checks:
    name: compliance checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify provenance and license
        run: python3 scripts/check_compliance.py

  desktop_smoke:
    name: desktop smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run desktop UI smoke tests
        run: npm run test:e2e

  backend_parity:
    name: backend parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run backend parity tests
        run: cargo test --test parity_test -- --nocapture

      # Tolerances are declared here as well as in the Rust defaults so the
      # agreed gate is visible without reading the source.
      - name: Run backend parity suite
        run: |
          cargo run -p storage-strategist -- parity --suite \
            --output parity-result.json \
            --max-files-delta 0 \
            --max-normalized-bytes-delta 0 \
            --max-residual-bytes-delta-ratio 0.005

      - name: Enforce backend parity tolerances
        if: always()
        run: |
          python3 scripts/check_parity_thresholds.py \
            --input parity-result.json \
            --max-files-delta 0 \
            --max-normalized-bytes-delta 0 \
            --max-residual-bytes-delta-ratio 0.005 \
            --min-shapes 7 \
            --require-pdu-backend

      - name: Upload backend parity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity-result
          path: parity-result.json
          if-no-files-found: warn

  evaluation_kpi:
    name: evaluation kpi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run evaluation suite
        run: |
          cargo run -p storage-strategist -- eval --suite fixtures/eval-suite.json --output eval-result.json

      - name: Enforce evaluation KPI thresholds
        run: |
          python3 scripts/check_eval_kpi_thresholds.py \
            --input eval-result.json \
            --min-precision-at-3 0.70 \
            --max-contradiction-rate 0.05 \
            --max-unsafe-recommendations 0

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result
          path: eval-result.json
          if-no-files-found: warn
