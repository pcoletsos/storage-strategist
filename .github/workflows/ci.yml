name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --all -- --check

  # fmt stays Linux-only: rustfmt ignores cfg gates, so its result does not
  # depend on the host. clippy and test compile cfg-gated code, so they run on
  # every platform. Linux keeps the bare check name that branch protection
  # requires; Windows and macOS report as `<job> (<os>)`.
  clippy:
    name: ${{ matrix.os == 'ubuntu-latest' && 'clippy' || format('clippy ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: ${{ matrix.os == 'ubuntu-latest' && 'test' || format('test ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --workspace

  compliance_checks:
    name: compliance checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify provenance and license
        run: python3 scripts/check_compliance.py

  desktop_smoke:
    name: desktop smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run desktop UI smoke tests
        run: npm run test:e2e

  # apps/desktop/src-tauri is excluded from the workspace, so no other job
  # compiles it. Windows is the desktop app's primary target, and unlike Linux
  # it needs no extra system packages to build Tauri.
  desktop_rust:
    name: desktop rust (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  backend_parity:
    name: backend parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The threshold script is the last line of this gate, so its own rules
      # are tested before it is trusted with the artifact.
      - name: Test parity threshold script
        run: python3 -m unittest discover -s tests -p "test_check_parity_thresholds.py" -v

      - name: Run backend parity tests
        run: cargo test --test parity_test -- --nocapture

      # Tolerances are declared here as well as in the Rust defaults so the
      # agreed gate is visible without reading the source.
      - name: Run backend parity suite
        run: |
          cargo run -p storage-strategist -- parity --suite \
            --output parity-result.json \
            --max-files-delta 0 \
            --max-normalized-bytes-delta 0 \
            --max-residual-bytes-delta-ratio 0.005

      - name: Enforce backend parity tolerances
        if: always()
        run: |
          python3 scripts/check_parity_thresholds.py \
            --input parity-result.json \
            --max-files-delta 0 \
            --max-normalized-bytes-delta 0 \
            --max-residual-bytes-delta-ratio 0.005 \
            --min-shapes 9 \
            --require-pdu-backend

      - name: Upload backend parity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity-result
          path: parity-result.json
          if-no-files-found: warn

  evaluation_kpi:
    name: evaluation kpi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run evaluation suite
        run: |
          cargo run -p storage-strategist -- eval --suite fixtures/eval-suite.json --output eval-result.json

      - name: Enforce evaluation KPI thresholds
        run: |
          python3 scripts/check_eval_kpi_thresholds.py \
            --input eval-result.json \
            --min-precision-at-3 0.70 \
            --max-contradiction-rate 0.05 \
            --max-unsafe-recommendations 0

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result
          path: eval-result.json
          if-no-files-found: warn
